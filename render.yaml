services:
  - type: web
    name: pathpilot-ai-backend
    runtime: docker
    dockerfilePath: ./PathPilotAI-backend/Dockerfile
    dockerContext: ./PathPilotAI-backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:5174
